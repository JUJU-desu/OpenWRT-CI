#CI项目
name: QCA-ALL

#CI计划
on:
  #自动检查：当Auto-Clean运行完成后，仅在上游源码有新提交时编译
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed
  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

#CI权限
permissions: write-all

concurrency:
  group: qca-m2-upstream
  cancel-in-progress: false

#CI任务
jobs:
  check-upstream:
    name: Check upstream M2 source
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{steps.check.outputs.changed}}
      upstream_sha: ${{steps.check.outputs.upstream_sha}}
    env:
      GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
      UPSTREAM_REPO: VIKINGYFY/immortalwrt
      UPSTREAM_BRANCH: main
    steps:
      - name: Compare upstream commit
        id: check
        shell: bash
        run: |
          set -euo pipefail

          upstream_sha=$(git ls-remote "https://github.com/${UPSTREAM_REPO}.git" "refs/heads/${UPSTREAM_BRANCH}" | awk '{print $1}')
          if [[ -z "$upstream_sha" ]]; then
            echo "Unable to resolve upstream commit" >&2
            exit 1
          fi

          previous_sha=$(gh variable get M2_UPSTREAM_SHA --repo "$GITHUB_REPOSITORY" --json value --jq '.value' 2>/dev/null || true)

          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$upstream_sha" != "$previous_sha" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "M2 source changed: ${previous_sha:-none} -> $upstream_sha"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "M2 source unchanged at $upstream_sha; skipping build"
          fi

  config:
    name: ${{matrix.CONFIG}}
    needs: check-upstream
    if: ${{ needs.check-upstream.outputs.changed == 'true' }}
    strategy:
      fail-fast: false
      #max-parallel: 3
      matrix:
        CONFIG: [ZN-M2-WIFI-NO]
        SOURCE: [VIKINGYFY/immortalwrt]
        BRANCH: [main]

    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{matrix.CONFIG}}
      #默认主题
      WRT_THEME: argon
      #默认主机名
      WRT_NAME: OWRT
      #默认WIFI名称
      WRT_SSID: OWRT
      #默认WIFI密码
      WRT_WORD: 12345678
      #默认地址
      WRT_IP: 192.168.10.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{matrix.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{matrix.SOURCE}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #长期使用的插件已固化进固件，不额外发布手动安装 APK
      WRT_MANUAL: ""
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST || false}}

  record-upstream:
    name: Record successful M2 source
    needs: [check-upstream, config]
    if: ${{ needs.config.result == 'success' && needs.check-upstream.outputs.changed == 'true' && inputs.TEST != true }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
    steps:
      - name: Save upstream commit
        run: gh variable set M2_UPSTREAM_SHA --repo "$GITHUB_REPOSITORY" --body "${{needs.check-upstream.outputs.upstream_sha}}"
